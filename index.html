<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>極速單字記憶</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0b0b0e;
    --card: #17171e;
    --card-border: #262633;
    --card-active: #22222d;
    --accent: #3b82f6;
    --text-primary: #f3f3f6;
    --text-secondary: #8e8e9c;
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.12);
  }
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body { 
    background: var(--bg); 
    color: var(--text-primary); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    padding: 16px;
    overflow-x: hidden;
  }
  .container { 
    width: 100%; 
    max-width: 440px; 
    min-height: 85vh;
    display: flex; 
    flex-direction: column; 
    justify-content: center;
  }

  /* 首頁：純按鈕選單 */
  #viewHome {
    display: flex;
    flex-direction: column;
    width: 100%;
    animation: fadeIn 0.2s ease-out;
  }
  .grid-levels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .level-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }
  .level-card:active {
    transform: scale(0.97);
    background: var(--card-active);
  }
  .level-card.special {
    grid-column: span 2;
    background: linear-gradient(135deg, #1a1f30 0%, #151620 100%);
    border-color: #353c52;
  }
  .lvl-name { 
    font-size: 1.25rem; 
    font-weight: 700; 
    color: #fff; 
    text-align: center;
  }

  /* 刷題頁面 */
  #viewPractice {
    display: none;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    animation: slideUp 0.2s ease-out;
  }
  .nav-bar { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
  }
  .btn-back {
    background: #1e1e28;
    border: 1px solid #303040;
    color: #cfcfe0;
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-back:active { transform: scale(0.96); }
  .current-mode-tag { font-size: 1rem; font-weight: 700; color: #fff; }
  .queue-tag { font-size: 0.85rem; color: var(--text-secondary); }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 24px 20px;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 12px 35px rgba(0,0,0,0.5);
  }
  
  .card-top { display: flex; flex-direction: column; gap: 8px; }
  .word-row { display: flex; align-items: center; justify-content: space-between; }
  .word-group { display: flex; align-items: baseline; gap: 10px; }
  .word-head { font-size: 2.3rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .pos-tag { font-size: 1.1rem; color: var(--accent); font-weight: 700; }
  
  .audio-btn {
    background: #242432;
    border: 1px solid #333345;
    color: #dcdce6;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.05rem;
  }
  .audio-btn:active { background: var(--accent); color: #fff; }

  .memory-status-wrap { display: flex; justify-content: flex-start; }
  .memory-status { 
    font-size: 0.78rem; 
    color: #9da3af; 
    background: #121218; 
    padding: 3px 9px; 
    border-radius: 8px; 
    border: 1px solid #232330; 
  }

  .content-area { margin: 20px 0; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
  .mask { filter: blur(9px); transition: filter 0.25s ease-out; cursor: pointer; }
  .unmasked { filter: none !important; cursor: default; }

  .def-box { margin-bottom: 16px; }
  .def-en { font-size: 1.02rem; color: #ededf2; margin-bottom: 6px; line-height: 1.45; }
  .def-zh { font-size: 1rem; color: var(--accent); font-weight: 600; }
  
  .sentence-list { 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
    border-top: 1px solid #242432; 
    padding-top: 14px; 
  }
  .sentence-item { font-size: 0.92rem; line-height: 1.48; color: #b5b5c4; }
  .sentence-item b { color: #ffffff; margin-right: 4px; }
  
  .control-wrapper { width: 100%; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.action-btn { 
    border: none; 
    padding: 16px; 
    border-radius: 15px; 
    font-size: 1.02rem; 
    font-weight: 700; 
    cursor: pointer; 
    transition: transform 0.12s; 
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.action-btn:active { transform: scale(0.97); }
  .btn-reveal { width: 100%; background: #272736; color: #fff; border: 1px solid #3b3b50; }
  .btn-fail { background: var(--danger-bg); color: var(--danger); border: 1.5px solid var(--danger); }
  .btn-pass { background: var(--success-bg); color: var(--success); border: 1.5px solid var(--success); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
  <!-- 首頁：純六個按鈕 -->
  <div id="viewHome">
    <div class="grid-levels">
      <div class="level-card" onclick="openPractice('1-2')">
        <div class="lvl-name">Lv 1-2</div>
      </div>

      <div class="level-card" onclick="openPractice('3')">
        <div class="lvl-name">Lv 3</div>
      </div>

      <div class="level-card" onclick="openPractice('4')">
        <div class="lvl-name">Lv 4</div>
      </div>

      <div class="level-card" onclick="openPractice('5')">
        <div class="lvl-name">Lv 5</div>
      </div>

      <div class="level-card" onclick="openPractice('6')">
        <div class="lvl-name">Lv 6</div>
      </div>

      <div class="level-card special" onclick="openPractice('all')">
        <div class="lvl-name">綜合隨機</div>
      </div>
    </div>
  </div>

  <!-- 刷題頁面 -->
  <div id="viewPractice">
    <div class="nav-bar">
      <button class="btn-back" onclick="goHome()">← 返回</button>
      <span class="current-mode-tag" id="currentModeLabel">Lv 1-2</span>
      <span class="queue-tag" id="queueCount">剩餘: 0</span>
    </div>

    <div class="card" id="card" onclick="handleCardClick()">
      <div class="card-top">
        <div class="word-row">
          <div class="word-group">
            <span class="word-head" id="cardWord">---</span>
            <span class="pos-tag" id="cardPos"></span>
          </div>
          <button class="audio-btn" id="audioBtn" onclick="speakWord(event)" title="朗讀單字">🔊</button>
        </div>
        <div class="memory-status-wrap">
          <span class="memory-status" id="memoryStatus">初次學習</span>
        </div>
      </div>

      <div class="content-area">
        <div id="secretArea" class="mask">
          <div class="def-box">
            <div class="def-en" id="cardDefEn">---</div>
            <div class="def-zh" id="cardDefZh">---</div>
          </div>
          <div class="sentence-list" id="sentenceList"></div>
        </div>
      </div>

      <div class="control-wrapper" onclick="event.stopPropagation()">
        <button class="action-btn btn-reveal" id="btnReveal" onclick="revealCard()">顯示釋義</button>
        <div class="actions" id="evalButtons" style="display: none;">
          <button class="action-btn btn-fail" onclick="answer(false)">不熟 (循環)</button>
          <button class="action-btn btn-pass" onclick="answer(true)">記住了</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="level1_2.js"></script>
<script src="level3.js"></script>
<script src="level4.js"></script>
<script src="level5.js"></script>
<script src="level6.js"></script>

<script>
function getFullDatabase() {
  return {
    "1-2": (typeof WORDS_LEVEL_1_2 !== 'undefined') ? WORDS_LEVEL_1_2 : [],
    "3":   (typeof WORDS_LEVEL_3 !== 'undefined')   ? WORDS_LEVEL_3 : [],
    "4":   (typeof WORDS_LEVEL_4 !== 'undefined')   ? WORDS_LEVEL_4 : [],
    "5":   (typeof WORDS_LEVEL_5 !== 'undefined')   ? WORDS_LEVEL_5 : [],
    "6":   (typeof WORDS_LEVEL_6 !== 'undefined')   ? WORDS_LEVEL_6 : []
  };
}

const INTERVALS = [0, 1, 2, 4, 7, 15, 30];

function getMemoryData() {
  return JSON.parse(localStorage.getItem('vocab_memory_data') || '{}');
}

function saveMemoryData(data) {
  localStorage.setItem('vocab_memory_data', JSON.stringify(data));
}

let currentMode = "1-2";
let deck = [];
let currentIndex = 0;
let isRevealed = false;

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function speakWord(e) {
  if (e) e.stopPropagation();
  const word = document.getElementById('cardWord').innerText;
  if (!word || word === "---") return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

function getRelativeTimeDescription(lastReviewTimestamp) {
  if (!lastReviewTimestamp) return "初次學習";
  const now = Date.now();
  const diffHours = (now - lastReviewTimestamp) / (1000 * 60 * 60);
  const diffDays = Math.floor(diffHours / 24);

  if (diffHours < 1) return "剛剛複習過";
  if (diffHours < 24) return "今天複習過";
  if (diffDays === 1) return "1 天前複習";
  return `${diffDays} 天前複習`;
}

function getDueWordsForLevel(lvl) {
  const db = getFullDatabase();
  const mem = getMemoryData();
  const now = Date.now();

  let list = [];
  if (lvl === 'all') {
    Object.values(db).forEach(group => {
      if (Array.isArray(group)) list.push(...group);
    });
  } else {
    list = db[lvl] || [];
  }

  return list.filter(item => {
    const record = mem[item.word];
    if (!record) return true;
    return now >= (record.nextReviewTime || 0);
  });
}

function openPractice(mode) {
  currentMode = mode;
  const titles = {
    "1-2": "Lv 1-2",
    "3": "Lv 3",
    "4": "Lv 4",
    "5": "Lv 5",
    "6": "Lv 6",
    "all": "綜合隨機"
  };
  document.getElementById('currentModeLabel').innerText = titles[mode];

  const db = getFullDatabase();
  let sourceWords = getDueWordsForLevel(mode);

  if (sourceWords.length === 0) {
    if (mode === 'all') {
      let all = [];
      Object.values(db).forEach(group => all.push(...group));
      sourceWords = shuffle(all);
    } else {
      sourceWords = [...(db[mode] || [])];
    }
  } else if (mode === 'all') {
    sourceWords = shuffle(sourceWords);
  }

  deck = [...sourceWords];
  currentIndex = 0;

  document.getElementById('viewHome').style.display = 'none';
  document.getElementById('viewPractice').style.display = 'flex';

  renderCard();
}

function goHome() {
  document.getElementById('viewPractice').style.display = 'none';
  document.getElementById('viewHome').style.display = 'flex';
}

function renderCard() {
  if (deck.length === 0) {
    document.getElementById('cardWord').innerText = "本組完成！";
    document.getElementById('cardPos').innerText = "";
    document.getElementById('memoryStatus').innerText = "進度達成";
    document.getElementById('secretArea').innerHTML = "<p style='margin-top:20px; color:#aaa; line-height:1.5;'>所有單字皆已掌握完畢。</p>";
    document.getElementById('secretArea').className = "unmasked";
    document.getElementById('btnReveal').style.display = "none";
    document.getElementById('evalButtons').style.display = "none";
    return;
  }

  isRevealed = false;
  document.getElementById('queueCount').innerText = `剩餘: ${deck.length}`;
  const current = deck[currentIndex];

  const mem = getMemoryData();
  const record = mem[current.word];
  const lastTime = record ? record.lastReviewTime : null;
  document.getElementById('memoryStatus').innerText = getRelativeTimeDescription(lastTime);

  document.getElementById('cardWord').innerText = current.word;
  document.getElementById('cardPos').innerText = current.pos || '';
  document.getElementById('cardDefEn').innerText = current.defEn || '';
  document.getElementById('cardDefZh').innerText = current.defZh || '';

  const list = document.getElementById('sentenceList');
  list.innerHTML = `
    <div class="sentence-item"><b>1.</b> ${current.ex1 || ''}</div>
    <div class="sentence-item"><b>2.</b> ${current.ex2 || ''}</div>
  `;

  const secret = document.getElementById('secretArea');
  secret.className = "mask";

  document.getElementById('btnReveal').style.display = "block";
  document.getElementById('evalButtons').style.display = "none";
}

function revealCard() {
  if (isRevealed) return;
  isRevealed = true;
  document.getElementById('secretArea').className = "unmasked";
  document.getElementById('btnReveal').style.display = "none";
  document.getElementById('evalButtons').style.display = "grid";
}

function handleCardClick() {
  if (!isRevealed) {
    revealCard();
  }
}

function answer(passed) {
  const current = deck[currentIndex];
  const mem = getMemoryData();
  let record = mem[current.word] || { stage: 0 };
  const now = Date.now();

  if (passed) {
    record.stage = Math.min(record.stage + 1, INTERVALS.length - 1);
    const intervalDays = INTERVALS[record.stage];
    record.lastReviewTime = now;
    record.nextReviewTime = now + (intervalDays * 24 * 60 * 60 * 1000);
    mem[current.word] = record;
    saveMemoryData(mem);

    deck.splice(currentIndex, 1);
  } else {
    record.stage = 0;
    record.lastReviewTime = now;
    record.nextReviewTime = now;
    mem[current.word] = record;
    saveMemoryData(mem);

    const item = deck.splice(currentIndex, 1)[0];
    deck.push(item);
  }
  
  if (deck.length > 0) {
    currentIndex = currentIndex % deck.length;
  }
  renderCard();
}

window.addEventListener('keydown', (e) => {
  if (e.code === "Space" && !isRevealed && document.getElementById('viewPractice').style.display === 'flex') {
    e.preventDefault();
    revealCard();
  }
});
</script>
</body>
</html>
