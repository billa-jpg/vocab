<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>極速單字記憶</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #09090b;
    --card: #15151c;
    --card-border: #232330;
    --accent: #3b82f6;
    --text-primary: #f4f4f7;
    --text-secondary: #888896;
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.12);
  }
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body { 
    background: var(--bg); 
    color: var(--text-primary); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    padding: 16px;
    overflow: hidden;
  }
  .container { 
    width: 100%; 
    max-width: 440px; 
    min-height: 90vh;
    display: flex; 
    flex-direction: column; 
    justify-content: center;
    position: relative;
  }

  /* 首頁 */
  #viewHome {
    display: flex;
    flex-direction: column;
    width: 100%;
    animation: fadeIn 0.2s ease-out;
  }
  .grid-levels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .level-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 26px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .level-card:active { transform: scale(0.96); }

  .lvl-1-2 { border-top: 3px solid #10b981; }
  .lvl-3   { border-top: 3px solid #3b82f6; }
  .lvl-4   { border-top: 3px solid #f59e0b; }
  .lvl-5   { border-top: 3px solid #a855f7; }
  .lvl-6   { border-top: 3px solid #f43f5e; }
  .lvl-all { 
    grid-column: span 2; 
    border-top: 3px solid #6366f1;
    background: linear-gradient(135deg, #131522 0%, #101016 100%);
  }

  .lvl-name { font-size: 1.3rem; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
  .lvl-tag { font-size: 0.72rem; color: var(--text-secondary); font-weight: 600; }

  /* 刷題頁面 */
  #viewPractice {
    display: none;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    height: 88vh;
    max-height: 720px;
    position: relative;
    animation: slideUp 0.2s ease-out;
  }
  .nav-bar { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    height: 40px;
  }
  .btn-back {
    background: #191922;
    border: 1px solid #282836;
    color: #cfcfe0;
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-back:active { transform: scale(0.95); }
  .current-mode-tag { font-size: 1rem; font-weight: 700; color: #fff; }
  .queue-tag { font-size: 0.85rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .card-container {
    position: relative;
    flex-grow: 1;
    width: 100%;
    display: flex;
    perspective: 1000px;
  }

  .card {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 16px 40px rgba(0,0,0,0.55);
    touch-action: none;
    will-change: transform, opacity;
    transition: transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.18s;
  }

  .swipe-badge {
    position: absolute;
    top: 24px;
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease;
  }
  .badge-pass {
    right: 20px;
    color: var(--success);
    border: 2px solid var(--success);
    transform: rotate(8deg);
  }
  .badge-fail {
    left: 20px;
    color: var(--danger);
    border: 2px solid var(--danger);
    transform: rotate(-8deg);
  }
  
  .card-top { display: flex; flex-direction: column; gap: 8px; }
  .word-row { display: flex; align-items: center; justify-content: space-between; }
  .word-group { display: flex; align-items: baseline; gap: 10px; }
  .word-head { font-size: 2.35rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .pos-tag { font-size: 1.1rem; color: var(--accent); font-weight: 700; }
  
  /* 聲音開關按鈕 */
  .audio-btn {
    background: #22222e;
    border: 1px solid #303042;
    color: #e0e0ec;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.2s;
  }
  .audio-btn.muted { opacity: 0.45; filter: grayscale(1); }
  .audio-btn:active { background: var(--accent); color: #fff; }

  .memory-status-wrap { display: flex; justify-content: flex-start; }
  .memory-status { 
    font-size: 0.78rem; 
    color: #9292a4; 
    background: #111116; 
    padding: 3px 9px; 
    border-radius: 8px; 
    border: 1px solid #20202c; 
  }

  .content-area { margin: 16px 0; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
  .mask { filter: blur(10px); transition: filter 0.22s ease-out; cursor: pointer; }
  .unmasked { filter: none !important; cursor: default; }

  .def-box { margin-bottom: 14px; }
  .def-en { font-size: 1.02rem; color: #ededf2; margin-bottom: 6px; line-height: 1.45; }
  .def-zh { font-size: 1rem; color: var(--accent); font-weight: 600; }
  
  .sentence-list { 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    border-top: 1px solid #232330; 
    padding-top: 12px; 
  }
  .sentence-item { font-size: 0.92rem; line-height: 1.45; color: #b0b0c2; }
  .sentence-item b { color: #ffffff; margin-right: 4px; }
  .hl-word { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  
  .control-wrapper { width: 100%; padding-top: 6px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.action-btn { 
    border: none; 
    padding: 16px; 
    border-radius: 16px; 
    font-size: 1rem; 
    font-weight: 700; 
    cursor: pointer; 
    transition: transform 0.1s; 
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.action-btn:active { transform: scale(0.96); }
  .btn-reveal { width: 100%; background: #242432; color: #fff; border: 1px solid #36364a; }
  .btn-fail { background: var(--danger-bg); color: var(--danger); border: 1.5px solid var(--danger); }
  .btn-pass { background: var(--success-bg); color: var(--success); border: 1.5px solid var(--success); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
  <!-- 首頁 -->
  <div id="viewHome">
    <div class="grid-levels">
      <div class="level-card lvl-1-2" onclick="openPractice('1-2')">
        <div class="lvl-name">Lv 1-2</div>
        <div class="lvl-tag">初階核心</div>
      </div>

      <div class="level-card lvl-3" onclick="openPractice('3')">
        <div class="lvl-name">Lv 3</div>
        <div class="lvl-tag">中階進階</div>
      </div>

      <div class="level-card lvl-4" onclick="openPractice('4')">
        <div class="lvl-name">Lv 4</div>
        <div class="lvl-tag">高頻關鍵</div>
      </div>

      <div class="level-card lvl-5" onclick="openPractice('5')">
        <div class="lvl-name">Lv 5</div>
        <div class="lvl-tag">前標挑戰</div>
      </div>

      <div class="level-card lvl-6" onclick="openPractice('6')">
        <div class="lvl-name">Lv 6</div>
        <div class="lvl-tag">頂標決勝</div>
      </div>

      <div class="level-card lvl-all" onclick="openPractice('all')">
        <div class="lvl-name">綜合隨機</div>
        <div class="lvl-tag">1～6 級無限全隨機抽測</div>
      </div>
    </div>
  </div>

  <!-- 刷題頁面 -->
  <div id="viewPractice">
    <div class="nav-bar">
      <button class="btn-back" onclick="goHome()">← 返回</button>
      <span class="current-mode-tag" id="currentModeLabel">Lv 1-2</span>
      <span class="queue-tag" id="queueCount">剩餘: 0</span>
    </div>

    <!-- 卡片拖曳區 -->
    <div class="card-container">
      <div class="card" id="card">
        <div class="swipe-badge badge-pass" id="badgePass">記住了 ✓</div>
        <div class="swipe-badge badge-fail" id="badgeFail">不熟 ✕</div>

        <div class="card-top">
          <div class="word-row">
            <div class="word-group">
              <span class="word-head" id="cardWord">---</span>
              <span class="pos-tag" id="cardPos"></span>
            </div>
            <!-- 自動發音開關 -->
            <button class="audio-btn" id="audioBtn" onclick="toggleAudio(event)" title="切換自動發音">🔊</button>
          </div>
          <div class="memory-status-wrap">
            <span class="memory-status" id="memoryStatus">初次學習</span>
          </div>
        </div>

        <div class="content-area">
          <div id="secretArea" class="mask">
            <div class="def-box">
              <div class="def-en" id="cardDefEn">---</div>
              <div class="def-zh" id="cardDefZh">---</div>
            </div>
            <div class="sentence-list" id="sentenceList"></div>
          </div>
        </div>

        <div class="control-wrapper" onclick="event.stopPropagation()">
          <button class="action-btn btn-reveal" id="btnReveal" onclick="revealCard()">顯示釋義 (點擊或上滑)</button>
          <div class="actions" id="evalButtons" style="display: none;">
            <button class="action-btn btn-fail" onclick="triggerAnswer(false)">不熟 (左滑)</button>
            <button class="action-btn btn-pass" onclick="triggerAnswer(true)">記住了 (右滑)</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 外部單字庫 -->
<script src="level1_2.js"></script>
<script src="level3.js"></script>
<script src="level4.js"></script>
<script src="level5.js"></script>
<script src="level6.js"></script>

<script>
function getFullDatabase() {
  return {
    "1-2": (typeof WORDS_LEVEL_1_2 !== 'undefined') ? WORDS_LEVEL_1_2 : [],
    "3":   (typeof WORDS_LEVEL_3 !== 'undefined')   ? WORDS_LEVEL_3 : [],
    "4":   (typeof WORDS_LEVEL_4 !== 'undefined')   ? WORDS_LEVEL_4 : [],
    "5":   (typeof WORDS_LEVEL_5 !== 'undefined')   ? WORDS_LEVEL_5 : [],
    "6":   (typeof WORDS_LEVEL_6 !== 'undefined')   ? WORDS_LEVEL_6 : []
  };
}

const INTERVALS = [0, 1, 2, 4, 7, 15, 30];

function getMemoryData() {
  return JSON.parse(localStorage.getItem('vocab_memory_data') || '{}');
}

function saveMemoryData(data) {
  localStorage.setItem('vocab_memory_data', JSON.stringify(data));
}

let currentMode = "1-2";
let deck = [];
let currentIndex = 0;
let isRevealed = false;
let isAnimating = false;

// 自動發音狀態 (預設開啟)
let isAutoAudio = localStorage.getItem('vocab_auto_audio') !== 'false';

function updateAudioBtnUI() {
  const btn = document.getElementById('audioBtn');
  if (isAutoAudio) {
    btn.innerText = '🔊';
    btn.classList.remove('muted');
  } else {
    btn.innerText = '🔇';
    btn.classList.add('muted');
  }
}

function toggleAudio(e) {
  if (e) e.stopPropagation();
  isAutoAudio = !isAutoAudio;
  localStorage.setItem('vocab_auto_audio', isAutoAudio);
  updateAudioBtnUI();
  if (isAutoAudio) {
    speakCurrentWord();
  }
}

// 朗讀當前單字
function speakCurrentWord() {
  if (!isAutoAudio) return;
  const word = document.getElementById('cardWord').innerText;
  if (!word || word === "---" || word === "本組完成！") return;

  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function getRelativeTimeDescription(lastReviewTimestamp) {
  if (!lastReviewTimestamp) return "初次學習";
  const now = Date.now();
  const diffHours = (now - lastReviewTimestamp) / (1000 * 60 * 60);
  const diffDays = Math.floor(diffHours / 24);

  if (diffHours < 1) return "剛剛複習過";
  if (diffHours < 24) return "今天複習過";
  if (diffDays === 1) return "1 天前複習";
  return `${diffDays} 天前複習`;
}

function highlightTargetWord(sentence, targetWord) {
  if (!sentence || !targetWord) return sentence;
  const root = targetWord.replace(/(ing|ed|es|s)$/i, '');
  const pattern = new RegExp(`\\b(${targetWord}|${root}[a-z]*)\\b`, 'gi');
  return sentence.replace(pattern, '<span class="hl-word">$1</span>');
}

function openPractice(mode) {
  currentMode = mode;
  const titles = {
    "1-2": "Lv 1-2",
    "3": "Lv 3",
    "4": "Lv 4",
    "5": "Lv 5",
    "6": "Lv 6",
    "all": "綜合隨機"
  };
  document.getElementById('currentModeLabel').innerText = titles[mode];

  const db = getFullDatabase();
  let sourceWords = [];

  if (mode === 'all') {
    Object.values(db).forEach(group => {
      if (Array.isArray(group)) sourceWords.push(...group);
    });
    sourceWords = shuffle(sourceWords);
  } else {
    sourceWords = [...(db[mode] || [])];
    sourceWords = shuffle(sourceWords);
  }

  deck = [...sourceWords];
  currentIndex = 0;

  document.getElementById('viewHome').style.display = 'none';
  document.getElementById('viewPractice').style.display = 'flex';

  renderCard();
}

function goHome() {
  window.speechSynthesis.cancel();
  document.getElementById('viewPractice').style.display = 'none';
  document.getElementById('viewHome').style.display = 'flex';
}

function renderCard() {
  const cardEl = document.getElementById('card');
  cardEl.style.transition = 'none';
  cardEl.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
  cardEl.style.opacity = '1';
  document.getElementById('badgePass').style.opacity = '0';
  document.getElementById('badgeFail').style.opacity = '0';

  if (deck.length === 0) {
    document.getElementById('cardWord').innerText = "本組完成！";
    document.getElementById('cardPos').innerText = "";
    document.getElementById('memoryStatus').innerText = "進度達成";
    document.getElementById('secretArea').innerHTML = "<p style='margin-top:20px; color:#aaa; line-height:1.5;'>所有單字皆已掌握完畢！</p>";
    document.getElementById('secretArea').className = "unmasked";
    document.getElementById('btnReveal').style.display = "none";
    document.getElementById('evalButtons').style.display = "none";
    return;
  }

  isRevealed = false;
  isAnimating = false;
  document.getElementById('queueCount').innerText = `剩餘: ${deck.length}`;
  const current = deck[currentIndex];

  const mem = getMemoryData();
  const record = mem[current.word];
  const lastTime = record ? record.lastReviewTime : null;
  document.getElementById('memoryStatus').innerText = getRelativeTimeDescription(lastTime);

  document.getElementById('cardWord').innerText = current.word;
  document.getElementById('cardPos').innerText = current.pos || '';
  document.getElementById('cardDefEn').innerText = current.defEn || '';
  document.getElementById('cardDefZh').innerText = current.defZh || '';

  const list = document.getElementById('sentenceList');
  const ex1Hl = highlightTargetWord(current.ex1 || '', current.word);
  const ex2Hl = highlightTargetWord(current.ex2 || '', current.word);
  
  list.innerHTML = `
    <div class="sentence-item"><b>1.</b> ${ex1Hl}</div>
    <div class="sentence-item"><b>2.</b> ${ex2Hl}</div>
  `;

  const secret = document.getElementById('secretArea');
  secret.className = "mask";

  document.getElementById('btnReveal').style.display = "block";
  document.getElementById('evalButtons').style.display = "none";

  // 切換卡片完成後自動念出英文單字
  speakCurrentWord();
}

function revealCard() {
  if (isRevealed) return;
  isRevealed = true;
  document.getElementById('secretArea').className = "unmasked";
  document.getElementById('btnReveal').style.display = "none";
  document.getElementById('evalButtons').style.display = "grid";
}

function triggerAnswer(passed) {
  if (isAnimating || deck.length === 0) return;
  isAnimating = true;

  const cardEl = document.getElementById('card');
  cardEl.style.transition = 'transform 0.18s ease-out, opacity 0.18s ease-out';

  if (passed) {
    cardEl.style.transform = 'translate3d(120%, 0, 0) rotate(20deg)';
    document.getElementById('badgePass').style.opacity = '1';
  } else {
    cardEl.style.transform = 'translate3d(-120%, 0, 0) rotate(-20deg)';
    document.getElementById('badgeFail').style.opacity = '1';
  }
  cardEl.style.opacity = '0';

  setTimeout(() => {
    executeAnswerLogic(passed);
  }, 180);
}

function executeAnswerLogic(passed) {
  const current = deck[currentIndex];
  const mem = getMemoryData();
  let record = mem[current.word] || { stage: 0 };
  const now = Date.now();

  if (passed) {
    record.stage = Math.min(record.stage + 1, INTERVALS.length - 1);
    const intervalDays = INTERVALS[record.stage];
    record.lastReviewTime = now;
    record.nextReviewTime = now + (intervalDays * 24 * 60 * 60 * 1000);
    mem[current.word] = record;
    saveMemoryData(mem);

    deck.splice(currentIndex, 1);
  } else {
    record.stage = 0;
    record.lastReviewTime = now;
    record.nextReviewTime = now;
    mem[current.word] = record;
    saveMemoryData(mem);

    const item = deck.splice(currentIndex, 1)[0];
    deck.push(item);
  }
  
  if (deck.length > 0) {
    currentIndex = currentIndex % deck.length;
  }
  renderCard();
}

/* 手勢滑動邏輯 */
const card = document.getElementById('card');
let startX = 0, startY = 0, currentX = 0, currentY = 0;
let isDragging = false;

card.addEventListener('pointerdown', (e) => {
  if (isAnimating || deck.length === 0) return;
  if (e.target.closest('button') || e.target.closest('.control-wrapper')) return;

  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  currentX = startX;
  currentY = startY;

  card.style.transition = 'none';
  card.setPointerCapture(e.pointerId);
});

card.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  currentX = e.clientX;
  currentY = e.clientY;

  const deltaX = currentX - startX;
  const deltaY = currentY - startY;
  const rotate = deltaX * 0.08;

  card.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0) rotate(${rotate}deg)`;

  const threshold = 50;
  if (deltaX > threshold) {
    const opacity = Math.min((deltaX - threshold) / 80, 1);
    document.getElementById('badgePass').style.opacity = opacity;
    document.getElementById('badgeFail').style.opacity = '0';
  } else if (deltaX < -threshold) {
    const opacity = Math.min((-deltaX - threshold) / 80, 1);
    document.getElementById('badgeFail').style.opacity = opacity;
    document.getElementById('badgePass').style.opacity = '0';
  } else {
    document.getElementById('badgePass').style.opacity = '0';
    document.getElementById('badgeFail').style.opacity = '0';
  }
});

card.addEventListener('pointerup', (e) => {
  if (!isDragging) return;
  isDragging = false;

  const deltaX = currentX - startX;
  const deltaY = currentY - startY;
  const swipeThreshold = 90;

  if (deltaX > swipeThreshold) {
    triggerAnswer(true);
    return;
  }
  if (deltaX < -swipeThreshold) {
    triggerAnswer(false);
    return;
  }
  if (deltaY < -60 || (Math.abs(deltaX) < 15 && Math.abs(deltaY) < 15)) {
    revealCard();
  }

  card.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1)';
  card.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
  document.getElementById('badgePass').style.opacity = '0';
  document.getElementById('badgeFail').style.opacity = '0';
});

card.addEventListener('pointercancel', () => {
  isDragging = false;
  card.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1)';
  card.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
  document.getElementById('badgePass').style.opacity = '0';
  document.getElementById('badgeFail').style.opacity = '0';
});

window.addEventListener('keydown', (e) => {
  if (document.getElementById('viewPractice').style.display !== 'flex') return;
  if (e.code === "Space") {
    e.preventDefault();
    revealCard();
  } else if (e.code === "ArrowRight") {
    triggerAnswer(true);
  } else if (e.code === "ArrowLeft") {
    triggerAnswer(false);
  }
});

updateAudioBtnUI();
</script>
</body>
</html>
</script>
</body>
</html>
